<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>سكني</title>
<meta name="theme-color" content="#6B1E2E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#F8F4F5;--card:#fff;--ink:#2A1419;--mute:#7A5F66;--line:#E8DCDF;--pri:#6B1E2E;--pri2:#5A1827;--soft:#F5E8EB;--acc:#E39A2D;--ok:#1E8E5A;--bad:#C8452F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1D1115;--card:#2A191E;--ink:#F3E8EA;--mute:#C2A5AB;--line:#45292F;--pri:#A63A50;--pri2:#F0AFBD;--soft:#3B2029}}
:root[data-theme="dark"]{--bg:#1D1115;--card:#2A191E;--ink:#F3E8EA;--mute:#C2A5AB;--line:#45292F;--pri:#A63A50;--pri2:#F0AFBD;--soft:#3B2029}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,Arial,sans-serif;font-size:16px;line-height:1.5}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative}
.pg{padding:18px 18px 96px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{border:0;background:var(--card);color:var(--ink);width:40px;height:40px;border-radius:12px;font-size:20px;cursor:pointer;border:1px solid var(--line)}
h1{font-size:24px;margin:0 0 6px;font-weight:800}h2{font-size:18px;margin:18px 0 10px;font-weight:700}
p{margin:0 0 10px;color:var(--mute)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:700 17px Tajawal,Tahoma;background:var(--pri);color:#fff;cursor:pointer;margin-top:12px}
.btn.o{background:transparent;color:var(--pri2);border:2px solid var(--pri)}
.btn:disabled{opacity:.5}
.btn:focus-visible,.back:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.nav button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
label{display:block;font-weight:500;margin:12px 0 5px;font-size:14px}
input,select,textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:16px Tajawal,Tahoma}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.hero{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center}
.logo{width:96px;height:96px;border-radius:28px;background:var(--pri);display:grid;place-items:center;font-size:48px;margin-bottom:20px}
.big{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big button{border:0;border-radius:18px;padding:22px 10px;background:var(--pri);color:#fff;font:700 17px Tajawal,Tahoma;cursor:pointer}
.big button:last-child{background:var(--acc);color:#2A1B00}
.big span{display:block;font-size:34px;margin-bottom:4px}
.pic{height:120px;border-radius:12px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:grid;place-items:center;font-size:44px;margin-bottom:10px;position:relative}
.pic.b{background:linear-gradient(135deg,#E39A2D,#B9731A)}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--pri2);font-size:13px;font-weight:500;margin:2px 0 2px 4px}
.ver{color:var(--ok);font-weight:700;font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.price{font-weight:800;color:var(--pri2)}
.fav{border:0;background:none;font-size:22px;cursor:pointer}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;border:0;background:none;padding:10px 2px;color:var(--mute);font:500 12px Tajawal,Tahoma;cursor:pointer}
.nav button b{display:block;font-size:20px;font-weight:400}
.nav button.on{color:var(--pri2);font-weight:800}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:10px;font:700 15px Tajawal,Tahoma;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--pri);color:#fff}
.acct{display:flex;gap:14px;align-items:center;width:100%;text-align:start;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:18px;margin-bottom:12px;font:700 18px Tajawal,Tahoma;cursor:pointer}
.acct span{font-size:36px}.acct small{display:block;font:400 13px Tajawal;color:var(--mute)}
.step{display:flex;align-items:center;gap:12px}
.step button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:22px;cursor:pointer}
.step b{min-width:28px;text-align:center;font-size:20px}
.seats{font-weight:700}.seats.low{color:var(--bad)}.seats.zero{color:var(--mute)}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:9;max-width:90%;font-weight:500}
.demo{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--pri2);margin-bottom:10px}
.ok{text-align:center;padding-top:60px}.ok .c{width:84px;height:84px;border-radius:50%;background:var(--ok);color:#fff;font-size:44px;display:grid;place-items:center;margin:0 auto 16px}
.otp{text-align:center;font-size:30px;letter-spacing:12px;direction:ltr}
.sum td{padding:4px 0}.sum td:last-child{text-align:left;font-weight:700}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin-bottom:10px}
.gal img{height:190px;flex:0 0 88%;max-width:88%;object-fit:cover;border-radius:14px;scroll-snap-align:start;cursor:zoom-in}
.gal.sm{margin:-4px 0 12px}.gal.sm img{height:84px;flex:0 0 auto;max-width:none;aspect-ratio:4/3;border-radius:10px}
.ph{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.th{position:relative;width:84px;height:84px}.th img{width:100%;height:100%;object-fit:cover;border-radius:10px;cursor:zoom-in}
.th button{position:absolute;top:-6px;left:-6px;width:26px;height:26px;border-radius:50%;border:0;background:var(--bad);color:#fff;cursor:pointer;font-size:16px;line-height:1}
.add{width:84px;height:84px;border:2px dashed var(--pri);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--pri2);font-size:26px;cursor:pointer}.add small{font-size:11px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:20;display:grid;place-items:center}.lb img{max-width:96%;max-height:90%;border-radius:12px}
textarea{resize:vertical}.step button:disabled{opacity:.35;cursor:default}
.bdg{background:var(--bad);color:#fff;border-radius:99px;font:700 11px Tajawal,Tahoma;padding:1px 6px}
.lang{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));inset-inline-end:16px;background:transparent;border:1px solid rgba(255,255,255,.7);color:#fff;border-radius:99px;padding:6px 14px;font:700 13px Tajawal,Tahoma,Arial,sans-serif;cursor:pointer}
.lang:focus-visible{outline:3px solid #E39A2D;outline-offset:2px}
.lnk{display:block;width:100%;background:none;border:0;color:var(--pri2);font:600 15px Tajawal,Tahoma,Arial,sans-serif;text-decoration:underline;margin-top:16px;padding:8px;cursor:pointer;text-align:center}
.lnk:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.stars{display:flex;gap:4px;margin:8px 0}.st{border:0;background:none;font-size:30px;line-height:1;color:var(--line);cursor:pointer;padding:2px}.st.on{color:var(--acc)}.st:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 14px;margin:0 0 8px 8px;font:500 14px Tajawal,Tahoma;cursor:pointer}.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}.chip:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
html.wbg,html.wbg body{background:#6B1E2E}
.wel{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;background:#6B1E2E;color:#fff}
.wlogo{width:173px;height:auto;display:block}
.wg{font:800 15px Tajawal,Tahoma,Arial,sans-serif;margin-top:14px}
.wt{font:800 17px Tajawal,Tahoma,Arial,sans-serif;margin-top:26px;line-height:1.6}
.wb{margin-top:58px;display:flex;flex-direction:column;align-items:center;gap:20px}
.wbtn{position:relative;width:204px;height:40px;border:0;border-radius:12px;background:#fff;color:#6B1E2E;font:800 16px Tajawal,Tahoma,Arial,sans-serif;cursor:pointer}
.wbtn::after{content:"";position:absolute;inset:3px;border:1px dashed #585858;border-radius:9px;pointer-events:none}
.wbtn:focus-visible{outline:3px solid #E39A2D;outline-offset:3px}
.wf{margin-top:90px;font:800 12px Tajawal,Tahoma,Arial,sans-serif;line-height:1.8;max-width:300px}
</style>

const ARR="\u0600-\u06FF";let ENR=null;
function enRx(){if(ENR)return ENR;const ks=Object.keys(EN).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\\/]/g,"\\$&"));ENR=new RegExp("(^|[^"+ARR+"])("+ks.join("|")+")(?!["+ARR+"])","g");return ENR}
function trP(t){t=t.replace(/(\d+) من (\d+)\)/g,"$1 of $2)");return t.replace(enRx(),(m,p,k)=>p+EN[k])}
function trM(t){if(EN[t])return EN[t];return t.split(/(\d+|\s·\s|\s[-–]\s|،\s?|:\s?|[()])/).map(x=>{const q=x.trim();return q&&EN[q]?x.replace(q,EN[q]):x}).join("")}
function trT(t){t=String(t==null?"":t);if(S.lang!=="en")return t.replace(/[\u2063\u2064]/g,"");const o=t.split(/(\u2063[^\u2064]*\u2064)/).map(x=>x[0]==="\u2063"?trM(x.slice(1,-1)):trP(x)).join("");return o.replace(/ر\.ع/g,"OMR").replace(/،/g,",").replace(/؟/g,"?").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[←→]/g,c=>c==="←"?"→":"←")}
function ue(s){return "\u2063"+esc(s)+"\u2064"}
function LC(){return S.lang==="en"?"en-GB":"ar-OM"}
function cf(m){return confirm(trT(m))}
function setLang(l){S.lang=l;save();render()}
function langBtn(){return `<button class="btn o" onclick="setLang('${S.lang==="en"?"ar":"en"}')">${S.lang==="en"?"العربية":"English"}</button>`}
function i18n(){try{const R=$;R.querySelectorAll("option").forEach(o=>{if(!o.hasAttribute("value"))o.setAttribute("value",o.textContent.replace(/[\u2063\u2064]/g,""))});const w=document.createTreeWalker(R,4),a=[];while(w.nextNode())a.push(w.currentNode);a.forEach(n=>{const v=trT(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v});R.querySelectorAll("[placeholder],[aria-label],[alt],[label]").forEach(e=>["placeholder","aria-label","alt","label"].forEach(k=>{if(e.hasAttribute(k))e.setAttribute(k,trT(e.getAttribute(k)))}));document.documentElement.dir=S.lang==="en"?"ltr":"rtl";document.documentElement.lang=S.lang==="en"?"en":"ar"}catch(x){}}
function hp(s){let h=5381;s=String(s||"");for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return String(h)}
function rvOf(k,id){return (S.rev||[]).filter(r=>r.k===k&&r.iid===id&&!r.hide)}
function avg(L){return L.length?L.reduce((a,r)=>a+r.stars,0)/L.length:0}
function stars(n){n=Math.round(n);return "★".repeat(n)+"☆".repeat(5-n)}
function rate(k,id){const L=rvOf(k,id);return L.length?`<p style="margin:0 0 6px;font-weight:700;font-size:14px"><span style="color:var(--acc)">★</span> ${avg(L).toFixed(1)} <small style="font-weight:400;color:var(--mute)">(${L.length})</small></p>`:""}
function contactBtns(it){if(!it.cp)return "";const n=esc(it.cp);return `<p style="margin:0 0 8px;font-size:14px">رقم التواصل: <b style="direction:ltr;display:inline-block">${ue(it.cp)}</b></p><div style="display:flex;gap:8px;margin:0 0 10px"><a class="btn o" style="margin:0;flex:1;padding:10px;text-decoration:none;text-align:center" href="tel:+968${n}">📞 اتصال</a><a class="btn o" style="margin:0;flex:1;padding:10px;text-decoration:none;text-align:center" href="https://wa.me/968${n}" target="_blank" rel="noopener">💬 واتساب</a></div>`}
function canRate(k,it){return !!(S.u&&S.bk.some(b=>b.ik===k&&b.iid===it.id&&b.ph===S.u.phone&&bst(b)==="confirmed"))}
function rvState(k,id){if(!S.rv||S.rv.k!==k||S.rv.id!==id){const m=(S.rev||[]).find(r=>r.k===k&&r.iid===id&&S.u&&r.sid===S.u.phone);S.rv={k,id,stars:m?m.stars:0,txt:m?m.txt:""}}return S.rv}
function setStars(k,id,n){rvState(k,id).stars=n;render()}
function sendRv(k,id){const R=rvState(k,id);if(!R.stars)return toast("اختر عدد النجوم");S.rev=S.rev.filter(r=>!(r.k===k&&r.iid===id&&r.sid===S.u.phone));S.rev.push({id:"r"+Date.now(),k,iid:id,sid:S.u.phone,sn:S.u.name,stars:R.stars,txt:(R.txt||"").trim(),date:new Date().toLocaleDateString(LC())});S.rv=null;save();toast("شكرًا، تم إرسال تقييمك");render()}
function rvForm(k,it){const R=rvState(k,it.id),had=(S.rev||[]).some(r=>r.k===k&&r.iid===it.id&&r.sid===S.u.phone);return `<div class="card"><b>${had?"عدّل تقييمك":"قيّم تجربتك"}</b><div class="stars" role="group" aria-label="التقييم">${[1,2,3,4,5].map(n=>`<button type="button" class="st ${n<=R.stars?"on":""}" aria-label="${n} من 5" onclick="setStars('${k}','${it.id}',${n})">★</button>`).join("")}</div><label for="rvt">تعليق (اختياري)</label><textarea id="rvt" rows="2" maxlength="200" oninput="rvState('${k}','${it.id}').txt=this.value">${ue(R.txt)}</textarea><button class="btn" onclick="sendRv('${k}','${it.id}')">إرسال التقييم</button></div>`}
function revSection(k,it){const L=rvOf(k,it.id).slice().reverse();return `<h2>التقييمات${L.length?` · ${avg(L).toFixed(1)} ★`:""}</h2>`+(L.slice(0,5).map(r=>`<div class="card"><div class="row"><b>${ue(String(r.sn||"").split(" ")[0]||"طالب")}</b><span style="color:var(--acc)">${stars(r.stars)}</span></div>${r.txt?`<p style="margin:4px 0 0;color:var(--ink)">${ue(r.txt)}</p>`:""}<p style="margin:4px 0 0;font-size:12px">${esc(r.date||"")}</p></div>`).join("")||'<div class="card">ما فيه تقييمات بعد.</div>')+(canRate(k,it)?rvForm(k,it):'<p style="font-size:13px">التقييم متاح للطالب اللي أكد المالك حجزه.</p>')+`<button class="lnk" onclick="startCmp('${k}','${it.id}')">⚠ تقديم شكوى على هذا الإعلان</button>`}
function rvHide(id){const r=S.rev.find(x=>x.id===id);if(r)r.hide=true;save();render()}
function revAdm(k,x){const L=(S.rev||[]).filter(r=>r.k===k&&r.iid===x.id&&!r.hide);if(!L.length)return "";return `<p style="margin:8px 0 2px;font-size:13px;color:var(--mute)">التقييمات (${L.length}) · ${avg(L).toFixed(1)} ★</p>`+L.slice(-3).map(r=>`<div class="row" style="font-size:13px;padding:2px 0"><span>${stars(r.stars)} ${ue(r.txt||"—")}</span><button class="fav" style="font-size:14px" aria-label="إخفاء التقييم" onclick="rvHide('${r.id}')">🗑</button></div>`).join("")}

function needSb(){if(!sb){toast("حدّث مفاتيح Supabase في الكود (SUPABASE_URL و SUPABASE_PUBLISHABLE_KEY)");return true}return false}
function supaErr(e){const m=String(e&&e.message||"").toLowerCase();
 if(m.includes("invalid login"))return "البريد أو كلمة المرور غير صحيحة";
 if(m.includes("already registered"))return "هذا البريد مسجل مسبقًا، سجّل دخولك";
 if(m.includes("signups not allowed")||m.includes("user not found"))return "هذا البريد غير مسجل";
 if(m.includes("rate limit")||m.includes("seconds")||m.includes("too many"))return "انتظر قليلًا ثم أعد المحاولة";
 if(m.includes("expired")||m.includes("invalid"))return "الرمز غير صحيح أو منتهي";
 return "تعذر إكمال العملية: "+(e&&e.message||"")}
async function run(fn){if(S.busy)return;S.busy=true;try{await fn()}catch(e){console.error(e);toast("تعذر الاتصال بالخادم، حاول مرة ثانية")}finally{S.busy=false}}
const normEmail=v=>String(v||"").trim().toLowerCase();

/* حفظ بيانات العميل في public.profiles: id يجي من auth.users.id (ما ننشئه يدويًا) */
async function ensureProfile(user){
 const md=user.user_metadata||{};
 const row={id:user.id};row[PC.name]=md.full_name||"";row[PC.phone]=md.phone||null;row[PC.email]=user.email||null;
 const q=await sb.from(PROFILES_TABLE).select("*").eq("id",user.id).maybeSingle();
 if(q.error)return {error:q.error};
 if(!q.data){const ins=await sb.from(PROFILES_TABLE).insert(row).select().single();return ins.error?{error:ins.error}:{data:ins.data}}
 const patch={};[PC.name,PC.phone,PC.email].forEach(k=>{if(!q.data[k]&&row[k])patch[k]=row[k]});
 if(Object.keys(patch).length){const up=await sb.from(PROFILES_TABLE).update(patch).eq("id",user.id).select().single();return up.error?{error:up.error}:{data:up.data}}
 return {data:q.data}}
async function afterAuth(user){
 const r=await ensureProfile(user);
 if(r.error){console.error("profiles:",r.error);toast(r.error.code==="23505"?"رقم الهاتف مستخدم في حساب ثاني":"تعذر حفظ بياناتك، حاول مرة ثانية")}
 const pr=r.data||{},md=user.user_metadata||{},p=(S.pf||{})[user.id];
 S.role=p?p.role:"";S.stu=p?p.stu:{};
 const RM={student:"s",housing_owner:"o",bus_owner:"v"};
 S.u={id:user.id,name:pr[PC.name]||md.full_name||"",phone:pr[PC.phone]||md.phone||"",email:user.email||"",st:pr.status||"active",roles:(Array.isArray(pr.roles)?pr.roles:[]).map(x=>RM[x]).filter(Boolean)};
 S.f={};S.pend=null;S.fs=1;
 go(enterAdmin()||S.role||S.stu.uni?"main":"type")}
function doReg(){return run(async()=>{if(needSb())return;const f=S.f;
 if(!f.name||f.name.trim().length<3)return toast("اكتب اسمك الكامل");
 if(!/^[79]\d{7}$/.test(f.phone||""))return toast("رقم الهاتف لازم يكون 8 أرقام ويبدأ بـ 9 أو 7");
 if(!/^\S+@\S+\.\S+$/.test(f.email||""))return toast("البريد الإلكتروني غير صحيح");
 if((f.pw||"").length<6)return toast("كلمة المرور 6 أحرف على الأقل");
 if(f.pw!==f.pw2)return toast("كلمتا المرور غير متطابقتين");
 const email=normEmail(f.email);
 const r=await sb.auth.signUp({email,password:f.pw,options:{data:{full_name:f.name.trim(),phone:f.phone}}});
 if(r.error)return toast(supaErr(r.error));
 if(r.data&&r.data.user&&Array.isArray(r.data.user.identities)&&r.data.user.identities.length===0)return toast("هذا البريد مسجل مسبقًا، سجّل دخولك");
 if(r.data&&r.data.session){console.warn("Confirm email غير مفعّل في Supabase: ما راح يوصل رمز تحقق");return afterAuth(r.data.user)}
 S.pend={email};S.f={};toast("تم إرسال الرمز إلى بريدك");go("otp")})}
function otp(){const P=S.pend||{};return `<div class="pg">${hdr("تحقق من بريدك الإلكتروني","reg")}<p>أرسلنا رمز التحقق إلى بريدك الإلكتروني ${ue(P.email||"")}.</p><label for="code">رمز التحقق</label><input id="code" class="otp" inputmode="numeric" maxlength="8" autocomplete="one-time-code" oninput="inp('code',this.value)"><button class="btn" onclick="doOtp()">تأكيد</button><button class="btn o" onclick="resendOtp()">إعادة إرسال الرمز</button></div>`}
function doOtp(){return run(async()=>{if(needSb())return;const P=S.pend||{},t=(S.f.code||"").replace(/\s/g,"");
 if(!t)return toast("اكتب الرمز");

function doLogin(){return run(async()=>{if(needSb())return;const f=S.f,email=normEmail(f.lp);
 if(!/^\S+@\S+\.\S+$/.test(email))return toast("البريد الإلكتروني غير صحيح");

  h=`<h1>${H?"لوحة صاحب السكن":"لوحة صاحب الباص"}</h1>${(n=>n?`<button class="btn" style="background:var(--acc);color:#2A1B00;margin:0 0 12px" onclick="openBk()">🔔 ${n} إشعار جديد، اضغط للتفاصيل</button>`:"")(myBk().filter(b=>!b.seen).length+myReq().filter(r=>!r.seen).length)}<div class="big" style="grid-template-columns:1fr 1fr 1fr;gap:8px">${[[mine.length,H?"عقاراتي":"خدماتي"],[cap-fr,"محجوزة"],[fr,"متاحة"]].map(x=>`<div class="card" style="text-align:center;margin:0"><div class="price" style="font-size:26px">${x[0]}</div><small style="color:var(--mute)">${x[1]}</small></div>`).join("")}</div><button class="btn" onclick="startAdd()">${H?"+ إضافة عقار":"+ إضافة خدمة نقل"}</button><h2>${H?"عقاراتي":"الخدمات النشطة"}</h2>`+(mine.length?mine.map(x=>oCard(x,H)).join(""):`<div class="card">ما أضفت شيء بعد. اضغط الزر فوق وانشر أول إعلان.</div>`)+``}
 return `<div class="pg">${h}</div>${onav()}`}
function N_g(g){S.np.g=g;if(g==="f")S.np.apts=[];render()}
function rm(i,t){const r=S.np.rooms[i];r.t=t;r.c=RTY.indexOf(t)+1;render()}
function addp(){const N=S.np,s=S.ws;let b;
 if(s===1)b=`<h2>معلومات العقار</h2>${nf("n","اسم العقار")}${wsel()}${nf("a","المنطقة")}${nf("cp","رقم التواصل (جوال أو واتساب)","tel","9xxxxxxx",'inputmode="numeric" maxlength="8"')}${locField("موقع العقار على الخريطة (اختياري)")}${nf("d","المسافة من الجامعة (كم)","number","2.5",'inputmode="decimal"')}<label>الفئة</label><div class="seg"><button class="${N.g==='m'?'on':''}" onclick="N_g('m')">🔵 طلاب</button><button class="${N.g==='f'?'on':''}" onclick="N_g('f')">🟣 طالبات</button></div><label for="rt">نوع الإيجار</label><select id="rt" onchange="np('rt',this.value)">${["شهري","فصل دراسي","سنوي"].map(x=>`<option ${x===N.rt?'selected':''}>${x}</option>`).join("")}</select>`;
 else if(s===2)b=`<h2>الغرف والأماكن</h2><p>السعر للشخص الواحد، وعدد الأماكن حسب نوع الغرفة.</p>${N.rooms.map((r,i)=>`<div class="card"><div class="row"><b>غرفة ${i+1}</b>${N.rooms.length+N.apts.length>1?`<button class="fav" aria-label="حذف الغرفة" onclick="S.np.rooms.splice(${i},1);render()">🗑</button>`:""}</div><label for="rt${i}">نوع الغرفة</label><select id="rt${i}" onchange="rm(${i},this.value)">${RTY.map(x=>`<option ${x===r.t?'selected':''}>${x}</option>`).join("")}</select><p style="margin:6px 0 0">الأماكن: <b>${r.c}</b></p><label for="rp${i}">السعر (ر.ع للشخص)</label><input id="rp${i}" type="number" inputmode="decimal" value="${esc(r.p)}" oninput="S.np.rooms[${i}].p=this.value"></div>`).join("")}<button class="btn o" onclick="S.np.rooms.push({t:'ثنائية',p:'',c:2});render()">+ إضافة غرفة</button>${aptForm(N)}`;
 else if(s===3)b=photosStep(N);
 else if(s===4)b=`<h2>ماذا يوفر السكن؟</h2><div>${chips(SVC,"sv")}</div>${csBox()}${ta("nt","ملاحظات للطلاب (اختياري)","مثال: الدخول بعد العاشرة مساءً ممنوع")}`;
 else if(s===5)b=docsStep(N);
 else b=`<h2>مراجعة الإعلان</h2><div class="card"><div class="ph">${N.ph.slice(0,5).map(x=>`<div class="th"><img src="${x}" alt="صورة"></div>`).join("")}</div><b>${ue(N.n)}</b><p style="margin:2px 0 8px">${N.w} – ${ue(N.a)} · ${N.d} كم · ${N.g==="m"?"طلاب":"طالبات"} · إيجار ${N.rt}</p>${N.rooms.map((r,i)=>`<div class="row"><span>غرفة ${i+1} · ${r.t} (${r.c} أماكن)</span><b>${r.p} ر.ع</b></div>`).join("")}${N.apts.map((a,i)=>`<div class="row"><span>شقة ${i+1} كاملة (${a.br} غرف)</span><b>${a.p} ر.ع</b></div>`).join("")}<div style="margin-top:8px">${N.sv.map(x=>`<span class="tag">${ue(x)}</span>`).join("")||"<p>بدون خدمات محددة</p>"}</div>${N.nt?`<p style="margin:8px 0 0"><b>ملاحظات:</b> ${ue(N.nt)}</p>`:""}${N.map?`<p class="ver" style="margin:8px 0 0">📍 تم تحديد الموقع</p>`:""}</div><div class="card"><b>الخطوة التالية</b><p style="margin:4px 0 0">ترسل إعلانك للمراجعة. بعد موافقة الإدارة نتواصل معك على واتساب لدفع رسوم النشر (5 ر.ع لمدة 4 أشهر)، وبعدها ينزل الإعلان للطلاب.</p></div><button class="btn" onclick="submitAd()">إرسال للمراجعة</button>`;
 return `<div class="pg">${hdr("إضافة عقار ("+s+" من 6)","main")}${b}${s<6?`<button class="btn" onclick="nx()">التالي</button>`:""}${s>1?`<button class="btn o" onclick="S.ws--;render()">السابق</button>`:""}</div>`}
function nx(){const N=S.np;if(S.ws===1&&(!N.n.trim()||!N.w||!N.a.trim()||!(+N.d>0)))return toast("أكمل اسم العقار والولاية والمنطقة والمسافة");if(S.ws===2){if(N.rooms.some(r=>!(+r.p>0))||N.apts.some(a=>!(+a.p>0)))return toast("اكتب سعر كل غرفة وكل شقة");if(!N.rooms.length&&!N.apts.length)return toast("أضف غرفة أو شقة على الأقل")}if(S.ws===1&&!/^[79]\d{7}$/.test((N.cp||"").trim()))return toast("رقم التواصل لازم يكون 8 أرقام ويبدأ بـ 9 أو 7");if(S.ws===1){const mp=getMap(N);if(mp)N.map=mp;else if((N.lk||"").trim())return toast("رابط الموقع غير صحيح، صححه أو احذفه")}if(S.ws===3){const e=photoErr(N);if(e)return toast(e)}if(S.ws===5){const e=docErr(N);if(e)return toast(e)}S.ws++;render();window.scrollTo(0,0)}
function addb(){const N=S.np;return `<div class="pg">${hdr("إضافة خدمة نقل","main")}${nf("n","اسم الخدمة")}${wsel()}${nf("from","منطقة الانطلاق")}${wlsel("fw","ولاية الانطلاق")}${vwBox()}${nf("cp","رقم التواصل (جوال أو واتساب)","tel","9xxxxxxx",'inputmode="numeric" maxlength="8"')}${nf("via","أحياء ومناطق يمر بها (اختياري)","text","مثال: الخوض، العذيبة")}<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div>${nf("gt","وقت الذهاب","time")}</div><div>${nf("bt","وقت العودة","time")}</div><div>${nf("p","السعر الشهري (ر.ع)","number","",'inputmode="decimal"')}</div><div>${nf("cap","عدد المقاعد","number","",'inputmode="numeric"')}</div></div><label for="veh">نوع المركبة</label><select id="veh" onchange="np('veh',this.value)">${["حافلة","ميني باص","فان"].map(x=>`<option ${x===N.veh?'selected':''}>${x}</option>`).join("")}</select><label>أيام النقل</label><div>${chips(DAYS,"days")}</div><label>خدمات الباص</label><div>${chips(SVB,"sv")}</div>${csBox()}${ta("nt","ملاحظات للطلاب (اختياري)","مثال: الباص يتحرك من عند مدخل الحي")}<label>صور المركبة (حتى 6)</label>${upl("p",0)}${busDocs()}<button class="btn" onclick="bnx()">إرسال للمراجعة</button></div>`}
function bnx(){const N=S.np;if(!N.n.trim()||!N.w||!N.from.trim())return toast("أكمل اسم الخدمة والمحافظة ومنطقة الانطلاق");if(!N.fw)return toast("اختر ولاية الانطلاق");if(!/^[79]\d{7}$/.test((N.cp||"").trim()))return toast("رقم التواصل لازم يكون 8 أرقام ويبدأ بـ 9 أو 7");if(!N.gt||!N.bt)return toast("حدد وقت الذهاب والعودة");if(!(+N.p>0)||!(+N.cap>0))return toast("اكتب السعر وعدد المقاعد");if(!N.days.length)return toast("اختر أيام النقل");if(!N.ph.length)return toast("أضف صورة واحدة على الأقل للمركبة");if(!N.dId.length||!N.dLic.length||!N.dVeh.length)return toast("أضف صورة البطاقة الشخصية ورخصة القيادة واستمارة المركبة");if(!N.ok)return toast("وافق على الإقرار أولًا");submitAd()}
function odone(){const P=S.odm==="paid";return `<div class="pg ok"><div class="c">${P?"✓":"📨"}</div><h1>${P?"تم نشر إعلانك بنجاح 🎉":"تم إرسال إعلانك للمراجعة"}</h1><p>${P?"يمكن للطلاب الآن مشاهدة إعلانك والتواصل معك.":"بعد موافقة الإدارة نتواصل معك على واتساب لدفع رسوم النشر (5 ر.ع)، وبعدها ينزل الإعلان للطلاب. تتابع الحالة من لوحتك."}</p><button class="btn" onclick="S.tab='home';go('main')">العودة للوحة</button></div>`}

render();
